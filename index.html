SELECT
  table_name,
  column_name,
  data_type,
  is_nullable
FROM information_schema.columns
WHERE table_schema = 'public'
  AND table_name IN (
    'students',
    'payments',
    'academic_years',
    'classes',
    'promotion_records',
    'student_results',
    'user_profiles'
  )
ORDER BY table_name, ordinal_position;

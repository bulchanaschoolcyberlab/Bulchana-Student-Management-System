
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102747">
<title>Sign In | Bulchana School</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background:
    linear-gradient(rgba(8,25,47,.28), rgba(8,25,47,.48)),
    url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1600&q=85")
    center/cover no-repeat fixed;
}

.login-card {
  width: 100%;
  max-width: 510px;
  padding: 43px 40px;
  background: rgba(255,255,255,.91);
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 27px;
  box-shadow: 0 25px 70px rgba(0,0,0,.22);
}

.school-brand {
  text-align: center;
  margin-bottom: 27px;
}

.brand-icon {
  width: 53px;
  height: 53px;
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
  background: #102747;
  color: #e5ad42;
  border-radius: 15px;
  font-family: Manrope, sans-serif;
  font-size: 27px;
  font-weight: 800;
}

.school-brand h2 {
  color: #102747;
  font-family: Manrope, sans-serif;
  font-size: 17px;
  font-weight: 800;
}

.school-brand p {
  color: #64748b;
  font-size: 10px;
  letter-spacing: 1.5px;
  margin-top: 4px;
}

h1 {
  color: #102747;
  font-family: Manrope, sans-serif;
  font-size: 29px;
  text-align: center;
  margin-bottom: 29px;
}

.field {
  margin-bottom: 22px;
}

.field label {
  display: block;
  color: #172b42;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 9px;
}

.input-wrap {
  position: relative;
}

.input-wrap input {
  width: 100%;
  height: 59px;
  padding: 0 48px 0 16px;
  border: 1px solid #d5dce5;
  border-radius: 11px;
  background: rgba(255,255,255,.95);
  font-size: 15px;
  color: #102747;
  outline: none;
  transition: .2s;
}

.input-wrap input:focus {
  border-color: #1765c1;
  box-shadow: 0 0 0 3px rgba(23,101,193,.12);
}

.input-wrap input::placeholder {
  color: #a3acb9;
}

.input-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #24384e;
  font-size: 20px;
  cursor: pointer;
}

.options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 5px 0 25px;
  font-size: 13px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #26384d;
}

.remember input {
  width: 19px;
  height: 19px;
  accent-color: #1765c1;
}

.options a {
  color: #1765a8;
  font-weight: 600;
  text-decoration: none;
}

.login-btn {
  width: 100%;
  height: 59px;
  background: #2876c9;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

.login-btn:hover {
  background: #155ca7;
}

.login-btn:disabled {
  opacity: .65;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 12px;
  margin-top: 17px;
  border-radius: 9px;
  text-align: center;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  background: #feecec;
  color: #a52626;
}

.message.success {
  display: block;
  background: #e7f7ed;
  color: #17683a;
}

.register-note {
  text-align: center;
  margin-top: 25px;
  color: #64748b;
  font-size: 14px;
}

.register-note a {
  color: #1765c1;
  font-weight: 700;
  text-decoration: none;
}

.back-home {
  display: block;
  text-align: center;
  margin-top: 22px;
  color: #52677e;
  font-size: 13px;
  text-decoration: none;
}

@media(max-width:520px) {
  body {
    padding: 17px;
    background-attachment: scroll;
  }

  .login-card {
    padding: 33px 22px;
    border-radius: 23px;
  }

  h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="login-card">

  <div class="school-brand">
    <div class="brand-icon">B</div>
    <h2>BULCHANA SCHOOL</h2>
    <p>STUDENT MANAGEMENT SYSTEM</p>
  </div>

  <h1>Welcome Back</h1>

  <form id="loginForm">

    <div class="field">
      <label for="email">Email Address</label>
      <div class="input-wrap">
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="username"
          required
        >
        <span class="input-icon">👤</span>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
        <button
          type="button"
          class="input-icon"
          id="togglePassword"
          aria-label="Show password"
        >◉</button>
      </div>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox" id="remember">
        Remember me
      </label>

      <a href="#" id="forgotPassword">Forgot password?</a>
    </div>

    <button type="submit" class="login-btn" id="loginButton">
      Login
    </button>

    <div class="message" id="message"></div>

  </form>

  <div class="register-note">
    New student?
    <a href="register.html">Register here</a>
  </div>

  <a href="index.html" class="back-home">← Back to Home</a>

</div>

<script>
const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

document.getElementById("togglePassword").addEventListener("click", function() {
  const showing = passwordInput.type === "text";
  passwordInput.type = showing ? "password" : "text";
  this.textContent = showing ? "◉" : "◎";
  this.setAttribute("aria-label", showing ? "Show password" : "Hide password");
});

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";
  message.className = "message";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    const { data: profile, error: profileError } = await supabaseClient
      .from("user_profiles")
      .select("role")
      .eq("user_id", data.user.id)
      .single();

    if (profileError || !profile) {
      throw new Error("Your school account profile was not found. Contact the school administrator.");
    }

    const role = String(profile.role).toLowerCase().trim();

    const dashboards = {
      admin: "admin/dashboard.html",
      teacher: "teacher/dashboard.html",
      student: "student/dashboard.html"
    };

    if (!dashboards[role]) {
      throw new Error("Your account does not have a recognized school role.");
    }

    showMessage("Login successful. Opening your portal...", "success");

    window.location.href = dashboards[role];

  } catch (error) {
    showMessage(error.message || "Login failed. Please try again.", "error");

    await supabaseClient.auth.signOut();

    loginButton.disabled = false;
    loginButton.textContent = "Login";
  }
});

document.getElementById("forgotPassword").addEventListener("click", async function(event) {
  event.preventDefault();

  const email = emailInput.value.trim();

  if (!email) {
    showMessage("Enter your email address first, then tap Forgot password.", "error");
    emailInput.focus();
    return;
  }

  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin +
        window.location.pathname.replace(/login\.html$/, "reset-password.html")
    });

    if (error) throw error;

    showMessage("If password recovery is enabled for your account, check your email for the reset link.", "success");

  } catch (error) {
    showMessage(error.message || "Could not send the password reset email.", "error");
  }
});
</script>

</body>
</html>

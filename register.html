
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Registration | Bulchana SMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">BULCHANA <span>SMS</span></a>
    <a href="login.html" class="text-link">Login</a>
  </header>

  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="eyebrow">TEACHER ACCOUNT</div>
      <h1>Create account</h1>
      <p class="muted">
        Teacher registration requires a code provided by the school administrator.
      </p>

      <form id="registerForm">
        <label for="email">Email address</label>
        <input id="email" type="email" required placeholder="Your email">

        <label for="password">Password</label>
        <input id="password" type="password" minlength="8" required placeholder="At least 8 characters">

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" minlength="8" required placeholder="Repeat password">

        <button class="btn full" id="registerButton" type="submit">
          Create Account
        </button>
      </form>

      <p id="message" class="message"></p>

      <p class="muted center">
        Already registered? <a href="login.html">Sign in</a>
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "Password must contain at least 8 characters.";
        message.className = "message error";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.className = "message error";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password
        });

        if (error) throw error;

        if (data.session) {
          message.textContent =
            "Account created. Continue to the teacher registration setup.";
        } else {
          message.textContent =
            "Account created. Check your email for the confirmation link. After confirmation, sign in to complete teacher registration.";
        }

        message.className = "message success";
        form.reset();

      } catch (error) {
        message.textContent = error.message;
        message.className = "message error";
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
